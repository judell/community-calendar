<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed Health Reports</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         max-width: 640px; margin: 0 auto; padding: 24px; line-height: 1.6; color: #333; }
  h1 { margin-bottom: 4px; }
  p { color: #666; }
  ul { list-style: none; padding: 0; }
  li { margin: 6px 0; }
  a.city { display: block; padding: 10px 14px; background: #f5f7fa; border-left: 3px solid #1976d2;
           text-decoration: none; color: #1976d2; font-weight: 600; text-transform: capitalize; }
  a.city:hover { background: #e8eef7; }
  .footer { margin-top: 28px; font-size: 0.85em; color: #666; }
</style>
</head>
<body>
<h1>Feed Health Reports</h1>
<p>Per-city build health, silent-feed analysis, and action items —
regenerated by each nightly build.</p>
<ul id="cities"><li>Loading cities…</li></ul>
<div class="footer">
  Aggregate history (all cities, large):
  <a href="https://raw.githubusercontent.com/judell/community-calendar/archive/report.json">report.json on the archive branch</a>
</div>
<script>
async function main() {
  const ul = document.getElementById('cities');
  try {
    const cities = await (await fetch('./cities.json')).json();
    ul.innerHTML = '';
    for (const city of Object.keys(cities).sort()) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.className = 'city';
      a.href = './report/' + city + '/';
      a.textContent = city;
      li.appendChild(a);
      ul.appendChild(li);
    }
  } catch (e) {
    ul.innerHTML = '<li>Could not load cities.json: ' + e + '</li>';
  }
}
main();
</script>
</body>
</html>
