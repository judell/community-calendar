<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Community Calendar</title>
    <script>
      if (location.hostname === '127.0.0.1' && location.port !== '8080') {
        var devQuery = location.search || '?city=bloomington&images=preview';
        location.replace('http://localhost:8080' + location.pathname + devQuery + location.hash);
      }
    </script>
    <script>
      // Cache-bust shell.js and shell.css. APP_VERSION isn't available yet
      // (shell.js sets it), so use Date.now() — these files are small.
      var _ccCacheBust = '?_=' + Date.now();
      document.write('<link rel="stylesheet" href="shell.css' + _ccCacheBust + '">');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/rrule@2.8.1/dist/es5/rrule.min.js"></script>
    <script>
      document.write('<script src="shell.js' + _ccCacheBust + '"><\/script>');
    </script>
  </head>
  <body>
  </body>
</html>
