name: Generate Calendar

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      locations:
        description: 'Locations to process (comma-separated: santarosa,bloomington,davis,montclair or "all")'
        required: false
        default: 'all'
      regenerate_only:
        description: 'Skip scrapers, still download ICS feeds, then regenerate'
        required: false
        type: boolean
        default: false
      months:
        description: 'Number of months ahead to scrape (default: 3)'
        required: false
        default: '3'
  schedule:
    - cron: '0 0 * * *'

jobs:
  generate-calendar:
    runs-on: ubuntu-latest
    env:
      SCRAPE_MONTHS: ${{ github.event.inputs.months || '3' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      #ENABLE_FUZZY_DEDUP: ${{ secrets.ANTHROPIC_API_KEY && 'true' || '' }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        # Drop the Chrome apt source (pre-installed on GitHub's runner image,
        # unused here) so a flaky dl.google.com mirror can't fail apt-get update.
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y libxml2-dev libxslt-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up build logging
      run: |
        > $GITHUB_WORKSPACE/build.log
        echo 'exec 2> >(tee -a $GITHUB_WORKSPACE/build.log >&2)' > /tmp/bash_env.sh
        echo "BASH_ENV=/tmp/bash_env.sh" >> $GITHUB_ENV

    - name: Determine locations to process
      id: locations
      run: |
        INPUT="${{ github.event.inputs.locations }}"
        ENABLED="${{ vars.ENABLED_CITIES }}"
        ALL=$(ls -d cities/*/feeds.txt 2>/dev/null | sed 's|cities/||;s|/feeds.txt||' | paste -sd, -)
        MANIFEST="$ALL"
        if [ -n "$ENABLED" ]; then
          MANIFEST="$ENABLED"
        fi
        if [ -z "$INPUT" ] || [ "$INPUT" = "all" ]; then
          # If ENABLED_CITIES is set for this repo/fork, use it as the default build scope.
          echo "list=$MANIFEST" >> $GITHUB_OUTPUT
        else
          echo "list=$INPUT" >> $GITHUB_OUTPUT
        fi
        echo "manifest_list=$MANIFEST" >> $GITHUB_OUTPUT

    # ==========================================
    # Scrapers (all cities, DB-first)
    # ==========================================
    # The active scraper rows in the feeds table are the only execution
    # set (see docs/local-build.md and reports/db-first-parity-2026-08-07.md).
    # Adding or removing a scraper is a database operation; the generated
    # read-only feeds.txt documents what the DB drives.
    - name: Run scrapers from DB
      if: github.event.inputs.regenerate_only != 'true'
      env:
        SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: |
        IFS=',' read -ra CITIES <<< "${{ steps.locations.outputs.list }}"
        for city in "${CITIES[@]}"; do
          city=$(echo "$city" | xargs)
          START=$(date +%s)
          echo "Running scrapers from DB for $city..."
          python scripts/run_scrapers_from_db.py --city "$city"
          echo "⏱ $city scrapers: $(( $(date +%s) - START ))s"
        done
      continue-on-error: true


    # ==========================================
    # Download feeds + Combine ICS (all cities)
    # ==========================================
    - name: Process pending feeds into DB
      env:
        SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: |
        python scripts/process_pending_feeds.py --all

    - name: Commit processed pending_feeds.txt
      run: |
        if git status --porcelain | grep -q pending_feeds.txt; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cities/*/pending_feeds.txt
          git commit -m "Process pending feeds into DB"
          git pull --rebase --autostash && git push || true
        else
          echo "No pending feeds to process"
        fi

    - name: Download live feeds
      env:
        SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: |
        IFS=',' read -ra CITIES <<< "${{ steps.locations.outputs.list }}"
        for city in "${CITIES[@]}"; do
          city=$(echo "$city" | xargs)
          START=$(date +%s)
          echo "Downloading feeds for $city..."
          python scripts/download_feeds.py "$city"
          echo "⏱ $city feeds: $(( $(date +%s) - START ))s"
        done

    - name: Export feeds.txt from DB
      env:
        SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: |
        IFS=',' read -ra CITIES <<< "${{ steps.locations.outputs.list }}"
        for city in "${CITIES[@]}"; do
          city=$(echo "$city" | xargs)
          python scripts/export_feeds_txt.py "$city"
        done

    - name: Combine ICS files
      run: |
        IFS=',' read -ra CITIES <<< "${{ steps.locations.outputs.list }}"
        for city in "${CITIES[@]}"; do
          city=$(echo "$city" | xargs)
          # Title-case the city name for the calendar name
          display=$(echo "$city" | sed 's/-/ /g;s/\b\(.\)/\u\1/g')
          if [ -d "cities/$city" ]; then
            START=$(date +%s)
            echo "Combining ICS for $city..."
            python scripts/combine_ics.py --input-dir "cities/$city" --output "cities/$city/combined.ics" --name "$display Community Calendar"
            echo "⏱ $city combine: $(( $(date +%s) - START ))s"
          fi
        done

    # ==========================================
    # Post-processing (all cities)
    # ==========================================
    - name: Generate cities.json
      run: python scripts/generate_cities_json.py --cities "${{ steps.locations.outputs.manifest_list }}"

    - name: Convert ICS to JSON for Supabase
      run: |
        IFS=',' read -ra CITIES <<< "${{ steps.locations.outputs.list }}"
        echo "Processing cities: ${CITIES[*]}"
        # Fetch archive branch for previous categories
        git fetch origin archive --depth=1 2>/dev/null || true
        for city in "${CITIES[@]}"; do
          city=$(echo "$city" | xargs)
          echo "Checking city: '$city'"
          # Get previous events.json (with categories) from archive branch
          git show origin/archive:cities/$city/events.json > "cities/$city/events.prev.json" 2>/dev/null || rm -f "cities/$city/events.prev.json"
          [ -s "cities/$city/events.prev.json" ] || rm -f "cities/$city/events.prev.json"
          if [ -f "cities/$city/combined.ics" ]; then
            START=$(date +%s)
            echo "Running ics_to_json for $city..."
            python scripts/ics_to_json.py "cities/$city/combined.ics" -o "cities/$city/events.json" --city "$city"
            echo "$city: Converted $(cat cities/$city/events.json | python -c 'import json,sys; print(len(json.load(sys.stdin)))') events to JSON"
            # Carry forward categories from previous build
            if [ -f "cities/$city/events.prev.json" ]; then
              python scripts/merge_categories.py "cities/$city/events.prev.json" "cities/$city/events.json"
              rm "cities/$city/events.prev.json"
            fi
            echo "⏱ $city convert: $(( $(date +%s) - START ))s"
          else
            echo "WARNING: cities/$city/combined.ics not found!"
            # Clean up prev file if no combined.ics
            rm -f "cities/$city/events.prev.json"
          fi
        done

    - name: Generate RSS feeds
      if: github.event.inputs.regenerate_only != 'true'
      run: |
        IFS=',' read -ra CITIES <<< "${{ steps.locations.outputs.list }}"
        for city in "${CITIES[@]}"; do
          city=$(echo "$city" | xargs)
          python scripts/generate_rss.py "$city" || true
        done

    - name: Classify events in JSON files
      if: env.ANTHROPIC_API_KEY
      env:
        SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
      run: |
        IFS=',' read -ra CITIES <<< "${{ steps.locations.outputs.list }}"
        FILES=""
        for city in "${CITIES[@]}"; do
          city=$(echo "$city" | xargs)
          if [ -f "cities/$city/events.json" ]; then
            FILES="$FILES cities/$city/events.json"
          fi
        done
        if [ -n "$FILES" ]; then
          python scripts/classify_events_json.py $FILES
        fi

    - name: Restore prior report history
      run: |
        curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/archive/report.json" -o report.json || true

    - name: Generate feed health report
      run: |
        python scripts/report.py --cities ${{ steps.locations.outputs.list }} --build-log build.log

    - name: Generate PRODID platform report
      run: python scripts/prodid.py

    - name: Validate pipeline output
      run: |
        python scripts/validate_pipeline.py --cities ${{ steps.locations.outputs.list }}

    - name: Upload events to Supabase
      env:
        SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ vars.SUPABASE_KEY }}
      run: |
        TOTAL_INSERTED=0
        IFS=',' read -ra UPLOAD_CITIES <<< "${{ steps.locations.outputs.list }}"
        for city in "${UPLOAD_CITIES[@]}"; do
          city=$(echo "$city" | xargs)
          if [ -f "cities/$city/events.json" ]; then
            START=$(date +%s)
            echo "Uploading $city events..."
            jq -c --arg city "$city" '{city: $city, events: .}' "cities/$city/events.json" > /tmp/payload_${city}.json
            RESPONSE=$(curl -sL -X POST "${SUPABASE_URL}/functions/v1/load-events" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/payload_${city}.json)
            echo "$city: $(echo "$RESPONSE" | jq -c '{success, inserted, deleted}')"
            SUCCESS=$(echo "$RESPONSE" | jq -r '.success // false')
            if [ "$SUCCESS" != "true" ]; then
              echo "Failed to upload $city"
              echo "$RESPONSE" | jq .
              exit 1
            fi
            INSERTED=$(echo "$RESPONSE" | jq -r '.inserted')
            TOTAL_INSERTED=$((TOTAL_INSERTED + INSERTED))
            echo "⏱ $city upload: $(( $(date +%s) - START ))s"
            rm -f /tmp/payload_${city}.json
          fi
        done
        echo "Successfully loaded $TOTAL_INSERTED total events into Supabase"

    - name: Refresh source names
      continue-on-error: true
      env:
        SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ vars.SUPABASE_KEY }}
      run: |
        IFS=',' read -ra UPLOAD_CITIES <<< "${{ steps.locations.outputs.list }}"
        for city in "${UPLOAD_CITIES[@]}"; do
          city=$(echo "$city" | xargs)
          echo "Refreshing source names for $city..."
          RESPONSE=$(curl -sL -w "\n%{http_code}" -X POST "${SUPABASE_URL}/rest/v1/rpc/refresh_source_names" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"target_city\": \"$city\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: refresh_source_names for $city failed (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi
          echo " done (HTTP $HTTP_CODE)"
        done

    - name: Refresh deduplicated events
      env:
        SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: |
        echo "Refreshing materialized view deduplicated_events..."
        RESPONSE=$(curl -sL -w "\n%{http_code}" -X POST "${SUPABASE_URL}/rest/v1/rpc/refresh_deduplicated_events" \
          -H "apikey: ${SUPABASE_SERVICE_KEY}" \
          -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
          -H "Content-Type: application/json" \
          -d '{}')
        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        BODY=$(echo "$RESPONSE" | sed '$d')
        if [ "$HTTP_CODE" -ge 400 ]; then
          echo "ERROR: refresh failed (HTTP $HTTP_CODE): $BODY"
          exit 1
        fi
        echo "done (HTTP $HTTP_CODE)"

    - name: Generate instance config files
      env:
        SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
      run: |
        cat > xmlui/config.local.js <<JSEOF
        window.SUPABASE_URL = '${SUPABASE_URL}';
        window.SUPABASE_KEY = '${SUPABASE_KEY}';
        JSEOF

        # Inject instance credentials into config.json
        python -c "
        import json
        with open('xmlui/config.json') as f:
            config = json.load(f)
        config['appGlobals']['supabaseUrl'] = '${SUPABASE_URL}'
        config['appGlobals']['supabasePublishableKey'] = '${SUPABASE_KEY}'
        with open('xmlui/config.json', 'w') as f:
            json.dump(config, f, indent=2)
            f.write('\n')
        "

    - name: Commit metadata changes
      env:
        GITHUB_TOKEN: ${{ secrets.COMMUNITY_CALENDAR }}
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

        git describe --tags --always > xmlui/version.txt

        git add -f xmlui/config.json
        git add cities.json report.html cities/*/feeds.txt
        [ -d rss ] && git add rss/*.xml || true
        git diff --staged --quiet || (
          git commit -m "Auto-generate calendar metadata"
          # On conflict, our regenerated files always win
          git pull --rebase --autostash -X theirs && git push
        )

    - name: Push build artifacts to archive branch
      env:
        GITHUB_TOKEN: ${{ secrets.COMMUNITY_CALENDAR }}
      run: |
        git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

        # Stash generated files before switching branches
        ARCHIVE_DIR=$(mktemp -d)
        IFS=',' read -ra CITIES <<< "${{ steps.locations.outputs.list }}"
        for city in "${CITIES[@]}"; do
          city=$(echo "$city" | xargs)
          mkdir -p "$ARCHIVE_DIR/cities/$city"
          cp cities/$city/events.json "$ARCHIVE_DIR/cities/$city/" 2>/dev/null || true
          cp cities/$city/combined.ics "$ARCHIVE_DIR/cities/$city/" 2>/dev/null || true
          for f in cities/$city/*.ics; do
            [ -f "$f" ] && cp "$f" "$ARCHIVE_DIR/cities/$city/" 2>/dev/null || true
          done
        done
        cp report.json "$ARCHIVE_DIR/" 2>/dev/null || true

        # Clean working tree so we can switch branches
        git checkout -- . 2>/dev/null || true
        git clean -fd 2>/dev/null || true

        # Fetch or create orphan archive branch
        if git fetch origin archive:archive 2>/dev/null; then
          git checkout archive
        else
          git checkout --orphan archive
          git rm -rf . 2>/dev/null || true
          git clean -fd 2>/dev/null || true
        fi

        # Replace only the cities that were built (preserve others)
        for city in "${CITIES[@]}"; do
          city=$(echo "$city" | xargs)
          git rm -rf "cities/$city" 2>/dev/null || true
        done
        git rm -f report.json 2>/dev/null || true
        cp -r "$ARCHIVE_DIR"/* .
        rm -rf "$ARCHIVE_DIR"

        git add cities/ report.json
        TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
        git commit -m "Build artifacts $TIMESTAMP" || echo "No changes to archive"
        git push origin archive

        # Return to main
        git checkout main
