name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  validate-feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history for diff

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync

      - name: Add venv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate feed/scraper consistency
        run: python scripts/validate_pr_feeds.py --base-ref origin/${{ github.base_ref }}

      - name: Run Python tests
        run: pytest tests/ -v

  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations to local database
        run: supabase db reset

      - name: Run database tests
        run: supabase test db supabase/tests/

  perf-gate:
    # Guards the collapseLongRunningEvents content-key cache (issue #77) so a
    # regression fails here in the PR instead of after a fork has merged it.
    # Adopted from the B-Square fork's ADR 0004 verification protocol.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify collapse-cache regression gate
        run: pnpm bench

  node-tests:
    # Vitest seam + static chrome checks (tests/js/): migration of the four
    # scripts/validate_*.js harnesses. Gates the PR alongside pytest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Run node tests (vitest)
        run: pnpm vitest run

  deno-tests:
    # Edge-function seam (supabase/functions/my-picks): the saved-picks ICS
    # feed collapses stored groups, which neither pytest nor vitest covers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2

      - name: Run Deno tests
        run: deno test supabase/functions/my-picks/dedupe_test.ts supabase/functions/load-events/scope_test.ts supabase/functions/load-events/auth_test.ts

  browser-tests:
    # Playwright gate over xmlui/test.html's served-file groups and the
    # date-tab accessibility spec (axe + keyboard/focus/360px, #109).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run browser tests
        run: pnpm playwright test

  lint:
    # Mirrors the local lint target (make lint): ruff (format + check), the
    # four type checkers (pyright, ty, pyrefly, zuban), and the JS gate
    # (prettier --check + eslint) all gate the job, so an introduced
    # finding fails the PR (ADR 0006 — phased rollout complete, ADR 0009).
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint (ruff + type checkers + JS)
        run: make lint
