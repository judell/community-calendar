# Dependency vulnerability scan (issue #163).
#
# `uv audit` checks the locked dependency set against the OSV database. It runs
# on PRs that touch dependency files and on a weekly schedule, so an advisory
# disclosed against an unchanged lock still surfaces. Local equivalent:
# `uv audit --locked --preview-features audit-command` — the preview flag only
# silences the "experimental command" warning; drop it once `audit` stabilizes.
# See docs/dependencies.md and ADR 0016.
name: Dependency Audit

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    # Mondays at 06:00 UTC, ahead of the working week.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Audit locked dependencies
        run: uv audit --locked --preview-features audit-command
